<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbit Clock</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#150f38;
    margin:0;
    padding:20px 0;

    display:flex;
    justify-content:flex-start;
    align-items:center;
    flex-direction:column;
}

.clock-container{
    position:relative;
    width:220px;
    height:220px;
}

.orbit{
    position:absolute;
    border:1px solid rgba(255,255,255,.2);
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.orbit1{
    width:180px;
    height:180px;
    animation:rotate 40s linear infinite;
}

.orbit2{
    width:140px;
    height:140px;
    animation:rotateReverse 25s linear infinite;
}

.orbit3{
    width:100px;
    height:100px;
    animation:rotate 15s linear infinite;
}

.planet{
    width:14px;
    height:14px;
    border-radius:50%;
    background:white;
    position:absolute;
}

.orbit1 .planet{
    top:-7px;
    left:50%;
    transform:translateX(-50%);
}

.orbit2 .planet{
    top:50%;
    right:-7px;
    transform:translateY(-50%);
}

.orbit3 .planet{
    bottom:-7px;
    left:50%;
    transform:translateX(-50%);
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:100px;
    height:100px;
    border-radius:50%;
    background:#14161f;
    border:1px solid rgba(255,255,255,.15);

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:20;
}

#time{
    font-size:1rem;
    font-weight:700;
    white-space:nowrap;
}

#date{
    margin-top:8px;
    font-size:.75rem;
    opacity:.75;
}

@keyframes rotate{
    from{transform:translate(-50%,-50%) rotate(0deg);}
    to{transform:translate(-50%,-50%) rotate(360deg);}
}

@keyframes rotateReverse{
    from{transform:translate(-50%,-50%) rotate(360deg);}
    to{transform:translate(-50%,-50%) rotate(0deg);}
}
body{
    overflow:hidden;
    background:#150f38;
}

.stars{
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%, white 1px, transparent 2px),
        radial-gradient(circle at 70% 40%, white 1px, transparent 2px),
        radial-gradient(circle at 40% 80%, white 1px, transparent 2px),
        radial-gradient(circle at 80% 15%, white 1px, transparent 2px);
    background-size:250px 250px;
    opacity:.4;
}

.sun{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#ffd54f;
    box-shadow:
        0 0 10px #ffd54f,
        0 0 25px #ffd54f;
    margin-bottom:10px;
}

.earth{
    background:#64b5f6;
    box-shadow:0 0 8px #64b5f6;
}

.moon{
    background:#d9d9d9;
}

.saturn{
    background:#ffb74d;
    box-shadow:0 0 8px #ffb74d;
}

.tick{
    position:absolute;
    width:2px;
    height:6px;
    background:rgba(255,255,255,.4);
    left:50%;
    top:8px;
    transform-origin:center 102px;
}
.today-panel{
    position:absolute;
    top:250px;
    left:50%;
    transform:translateX(-50%);

    width:250px;
    text-align:center;

    font-size:.9rem;
    opacity:.8;
}

.today-panel::before{
    content:"";

    display:block;

    width:120px;
    height:1px;

    background:rgba(255,255,255,.15);

    margin:0 auto 10px auto;
}

.events-panel{
    position:absolute;

    top:300px;
    left:50%;

    transform:translateX(-50%);

    width:250px;

    text-align:center;
}

.events-title{
    font-size:.7rem;

    letter-spacing:2px;

    opacity:.6;

    margin-bottom:15px;
}

.event-item{
    margin-bottom:16px;
}

.event-name{
    font-weight:600;
}

.event-date{
    font-size:.85rem;
    opacity:.6;
}

.event-countdown{
    color:#9dc4ff;
    font-size:.85rem;
}

body{
    color:#f2f4ff;
}

#time{
    color:#ffffff;
    text-shadow:0 0 8px rgba(255,255,255,.25);
}

#date,
#today-date,
.events-title,
.event-date{
    color:rgba(255,255,255,.85);
    opacity:1;
}

.event-name{
    color:#ffffff;
}

.event-countdown{
    color:#aecdff;
    font-weight:600;
}

.today-panel,
.events-panel{
    color:#ffffff;
    z-index:50;
}

</style>
</head>
<body>

<div class="stars"></div>

<div class="clock-container">

  <div class="orbit orbit1">
    <div class="planet saturn"></div>
</div>

<div class="orbit orbit2">
    <div class="planet earth"></div>
</div>

<div class="orbit orbit3">
    <div class="planet moon"></div>
</div>

    <div class="center">
    <div class="sun"></div>
    <div id="time">00:00:00</div>
    <div id="date">Thursday</div>
</div>
<div class="today-panel">
    <div id="today-date"></div>
</div>

<div class="events-panel">

    <div class="events-title">
        UPCOMING CELESTIAL
    </div>

    <div id="events-list"></div>

</div>

<script>
function updateClock(){
    const now = new Date();

    const time = now.toLocaleTimeString('en-US',{
        hour12:true
    });

    const day = now.toLocaleDateString('en-US',{
        weekday:'long'
    });

    document.getElementById('time').textContent = time;
    document.getElementById('date').textContent = day;
document.getElementById('today-date')
.textContent =
now.toLocaleDateString(
    'en-US',
    {
        day:'numeric',
        month:'long',
        year:'numeric'
    }
);
}

updateClock();
setInterval(updateClock,1000);
const events = [

{
    icon:"🌕",
    name:"New Moon",
    date:"2026-07-14"
},

{
    icon:"🌒",
    name:"Solar Eclipse",
    date:"2026-08-12"
},

{
    icon:"🌠",
    name:"Perseid Meteor Shower",
    date:"2026-08-12"
}

];

function renderEvents(){

    const container =
    document.getElementById("events-list");

    container.innerHTML = "";

    const now = new Date();

    events.forEach(event=>{

        const target =
        new Date(event.date);

        const days =
        Math.ceil(
            (target-now)/(1000*60*60*24)
        );

        container.innerHTML += `
        <div class="event-item">

            <div class="event-name">
                ${event.icon}
                ${event.name}
            </div>

            <div class="event-date">
                ${target.toLocaleDateString(
    'en-US',
    {
        day:'numeric',
        month:'long',
        year:'numeric'
    }
)}
            </div>

            <div class="event-countdown">
                in ${days} days
            </div>

        </div>
        `;
    });

}

renderEvents();
const container = document.querySelector('.clock-container');

for(let i=0;i<12;i++){
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.transform =
        `translateX(-50%) rotate(${i*30}deg)`;
    container.appendChild(tick);
}
</script>

</body>
</html>
